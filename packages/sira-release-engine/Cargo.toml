[package]
name = "sira-release-engine"
version = "1.0.0"
edition = "2021"
authors = ["Siragugal Film Studio Contributors"]
license = "MIT OR Apache-2.0"
description = "End-to-End Integration Verification & Release Packaging Engine for Siragugal Film Studio"

[dependencies]
sira_types = { path = "../sira-types" }
sira_core = { path = "../sira-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v7", "serde"] }
thiserror = "1.0"
