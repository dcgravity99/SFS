[package]
name = "sira-deployment-engine"
version = "1.0.0"
edition = "2021"
authors = ["Siragugal Film Studio Contributors"]
license = "MIT OR Apache-2.0"
description = "Enterprise Deployment & Distribution Pipeline for Siragugal Film Studio"

[dependencies]
sira_types = { path = "../sira-types" }
sira-release-engine = { path = "../sira-release-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v7", "serde"] }
thiserror = "1.0"
